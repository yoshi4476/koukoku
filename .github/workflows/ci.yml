name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # バージョンは package.json の packageManager に従う (ここで指定すると二重定義でエラー)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adgrid/shared build
      - run: pnpm --filter @adgrid/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @adgrid/api eval   # プロンプト/辞書のeval回帰 (A-2)
      - run: pnpm --filter @adgrid/api build
      - run: pnpm --filter @adgrid/web build
